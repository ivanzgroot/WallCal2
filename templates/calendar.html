<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <meta name="description" content="WallCal — Wall-mounted calendar display">
    <title>WallCal</title>
    <!--
      Inter is loaded asynchronously and never blocks the first paint. A wall
      display often has no internet, or slow DNS, and a render-blocking
      stylesheet from an external host leaves the screen white until the
      request times out. The local stack below is what actually gets used on
      a Raspberry Pi; Inter simply upgrades it when the network cooperates.
    -->
    <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ static_url('css/tokens.css') }}">
    <link rel="stylesheet" href="{{ static_url('css/wall.css') }}">
</head>
<body data-theme="dark" data-animations="off">
    <!-- Weather and waste symbols, inline. A wall display often has no
         internet, so an icon font or a fetched sprite would be a blank box
         at exactly the wrong moment. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
      </symbol>
      <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>
      </symbol>
      <symbol id="i-partly" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <circle cx="8.5" cy="8.5" r="3.2"/><path d="M8.5 1.8v1.6M1.8 8.5h1.6M3.9 3.9l1.1 1.1M13.1 3.9l-1.1 1.1"/>
        <path d="M9 19.5h8.4a3.1 3.1 0 0 0 .3-6.2 4.4 4.4 0 0 0-8.5-.9 3.5 3.5 0 0 0-.2 7.1z"/>
      </symbol>
      <symbol id="i-partly-night" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13.5 8.2A5.2 5.2 0 0 1 7.4 2a5.2 5.2 0 1 0 6.1 6.2z"/>
        <path d="M9 19.5h8.4a3.1 3.1 0 0 0 .3-6.2 4.4 4.4 0 0 0-8.5-.9 3.5 3.5 0 0 0-.2 7.1z"/>
      </symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M7 19h10.2a3.4 3.4 0 0 0 .3-6.8 4.9 4.9 0 0 0-9.4-1 3.9 3.9 0 0 0-1.1 7.8z"/>
      </symbol>
      <symbol id="i-fog" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M7 14h10.2a3.4 3.4 0 0 0 .3-6.8 4.9 4.9 0 0 0-9.4-1A3.9 3.9 0 0 0 7 14z"/>
        <path d="M4 17.5h16M6.5 20.5h11"/>
      </symbol>
      <symbol id="i-drizzle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M7 15h10.2a3.4 3.4 0 0 0 .3-6.8 4.9 4.9 0 0 0-9.4-1A3.9 3.9 0 0 0 7 15z"/>
        <path d="M10 18.5v1.5M14 18.5v1.5"/>
      </symbol>
      <symbol id="i-rain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M7 15h10.2a3.4 3.4 0 0 0 .3-6.8 4.9 4.9 0 0 0-9.4-1A3.9 3.9 0 0 0 7 15z"/>
        <path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3"/>
      </symbol>
      <symbol id="i-snow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M7 14h10.2a3.4 3.4 0 0 0 .3-6.8 4.9 4.9 0 0 0-9.4-1A3.9 3.9 0 0 0 7 14z"/>
        <path d="M9.5 17.5h.01M12 20h.01M14.5 17.5h.01M12 17h.01"/>
      </symbol>
      <symbol id="i-storm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 14h10.2a3.4 3.4 0 0 0 .3-6.8 4.9 4.9 0 0 0-9.4-1A3.9 3.9 0 0 0 7 14z"/>
        <path d="M13 15.5l-2.5 3.8h3L11.5 22.5"/>
      </symbol>
      <symbol id="i-bin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l1 13h9l1-13"/><path d="M10 11v5M14 11v5"/>
      </symbol>
    </defs></svg>
    <!-- ============================================================
         THE WALL DISPLAY

         Both density layers stay in the DOM and stay current. Switching
         is a class change, so the crossfade is opacity only — never a
         re-fetch, never a reflow that could flash on the panel.
         ============================================================ -->
    <div id="app" data-density="far" data-mode="normal" data-drift="on"
         data-power="on" data-brightness-source="css">
        <div id="dim"></div>

        <div id="drift">
            <!-- ---------- FAR: readable across the room ---------- -->
            <section id="far" class="layer">
                <div class="label" id="farDate">&nbsp;</div>
                <div class="far-clock" id="farClock">--:--</div>
                <div class="far-next" id="farNext"></div>
                <div class="far-wx" id="farWeather" hidden></div>
                <div class="travel" id="farTravel" hidden></div>
                <div class="far-bin" id="farBin" hidden></div>
            </section>

            <!-- ---------- NEAR: the calendar, at arm's length ---------- -->
            <section id="near" class="layer">
                <header class="near-bar">
                    <span class="near-clock" id="nearClock">--:--</span>
                    <span class="near-date" id="nearDate">&nbsp;</span>
                    <span class="spacer"></span>
                    <span class="stale" id="staleDot" title="Data is older than usual"></span>
                </header>

                <div class="near-body">
                    <div class="cal box">
                        <div class="cal-title" id="calTitle">&nbsp;</div>
                        <div class="cal-dow" id="calDow"></div>
                        <div class="cal-grid" id="calGrid"></div>
                    </div>

                    <!-- Slots are reserved whether or not their widget is
                         showing, so a bus becoming due never reshuffles the
                         column around it. -->
                    <!-- Cards share the column and grow into whatever space
                         is free, so a widget withdrawing does not leave a
                         hole. Abfall takes the top when it is due: it exists
                         to be seen on the way past. -->
                    <aside class="rail">
                        <div class="box abfall" id="nearBin" hidden></div>
                        <div class="box">
                            <div class="rail-k">Als n&auml;chstes</div>
                            <div id="railList"></div>
                            <div class="travel" id="travelHint" hidden></div>
                        </div>
                        <div class="box" id="transitBoard" hidden></div>
                        <div class="box" id="nearWeather" hidden></div>
                        <div class="rail-foot">
                            <span class="stale" id="staleFoot"></span>
                            <div class="qr" id="qrBox" hidden></div>
                        </div>
                    </aside>
                </div>
            </section>
        </div>

        <a id="settingsBtn" href="/settings" title="Einstellungen" aria-label="Einstellungen">&#9881;</a>
    </div>

    <!-- The settings modal used to live here. It is a page of its own now:
         /settings, with a real responsive viewport, reached by scanning the
         QR code off the wall. -->

    <script src="{{ static_url('js/wall.js') }}"></script>
</body>
</html>
